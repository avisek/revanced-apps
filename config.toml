enable-module-update = true # set this to false if you do not want to receive updates for the module
parallel-jobs = 1
rebuild-all-on-update = true # set this to false to rebuild only the apps that have updates

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/avisek/revanced-apps/blob/main/CONFIG.md for more detailed explanations

# you can use https://j-hc.github.io/rvmm-config-gen/ to generate a config

[YouTube-Extended]
app-name = "YouTube"
patches-source = "anddea/revanced-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "ReVanced Extended"
patcher-args = "-e 'Theme' -OdarkThemeColor=#FF0F0F0F"
build-mode = "both"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

