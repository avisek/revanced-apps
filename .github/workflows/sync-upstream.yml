# Merges j-hc/revanced-magisk-module into main weekly.
# config.toml and README.md are fork-owned: upstream changes to them are discarded.
# Conflict or drift outside the known custom surface (see `allow`) -> aborts, opens an issue.
# GITHUB_TOKEN can't push commits touching .github/workflows, so upstream workflow changes
# need a `SYNC_TOKEN` secret (fine-grained PAT: contents + workflows write).
name: Sync Upstream
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  sync:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/j-hc/revanced-magisk-module
          # explicit refspec: upstream repo has a *tag* also named 'main'
          git fetch upstream +refs/heads/main:refs/remotes/upstream/main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already up to date"
            exit 0
          fi
          git merge --no-ff --no-commit upstream/main || :
          git checkout HEAD -- config.toml README.md
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::merge conflict, manual merge needed:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi
          git commit --no-edit
          allow='^(\.github/workflows/(build|ci|sync-upstream)\.yml|CONFIG\.md|README\.md|build\.sh|config\.toml|module/customize\.sh|utils\.sh)$'
          unexpected=$(git diff upstream/main --name-only | grep -Ev "$allow" || :)
          if [ "$unexpected" ]; then
            echo "::error::unexpected drift from upstream (possible force-push residue):"
            echo "$unexpected"
            exit 1
          fi
          git push origin main

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Upstream sync needs manual merge"
          if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" \
              -f body="Automatic upstream sync failed (conflict, drift or push rejected). See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              || echo "could not open issue"
          fi
